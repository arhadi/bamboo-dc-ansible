---
# ============================================================
# Bamboo Data Center - Handlers
# ============================================================

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Bamboo
  ansible.builtin.systemd:
    name: "{{ bamboo_service_name }}"
    state: restarted
  when:
    - bamboo_service_name is defined
